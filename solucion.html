<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de promedio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #18212f;
      --muted: #667085;
      --surface: #ffffff;
      --line: #d9e2ec;
      --accent: #116d6e;
      --accent-strong: #0b4f52;
      --accent-soft: #e4f7f4;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(228, 247, 244, 0.95), rgba(255, 241, 230, 0.86)),
        #f6f8fb;
    }

    .page-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .average-card {
      width: min(100%, 440px);
      padding: 32px;
      background: var(--surface);
      border: 1px solid rgba(17, 109, 110, 0.14);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(24, 33, 47, 0.12);
    }

    .average-header {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .average-header h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 1.85rem);
      font-weight: 750;
      letter-spacing: 0;
    }

    .average-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .form-label {
      color: #344054;
      font-weight: 650;
    }

    .form-control {
      min-height: 48px;
      border-color: var(--line);
      border-radius: 8px;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(17, 109, 110, 0.16);
    }

    .btn-average {
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      font-weight: 700;
      letter-spacing: 0;
    }

    .btn-average:hover,
    .btn-average:focus {
      background: var(--accent-strong);
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border: 1px solid rgba(17, 109, 110, 0.18);
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 480px) {
      .average-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <form class="average-card" aria-labelledby="titulo-promedio">
      <header class="average-header text-center">
        <h1 id="titulo-promedio">Formulario de promedio</h1>
        <p>Calcula el promedio de tres valores.</p>
      </header>

      <div class="mb-3">
        <label for="num_numero1" class="form-label">N&uacute;mero 1</label>
        <input type="number" step="any" class="form-control" id="num_numero1" name="num_numero1" required>
      </div>

      <div class="mb-3">
        <label for="num_numero2" class="form-label">N&uacute;mero 2</label>
        <input type="number" step="any" class="form-control" id="num_numero2" name="num_numero2" required>
      </div>

      <div class="mb-4">
        <label for="num_numero3" class="form-label">N&uacute;mero 3</label>
        <input type="number" step="any" class="form-control" id="num_numero3" name="num_numero3" required>
      </div>

      <button type="submit" class="btn btn-primary btn-average w-100" id="btn_promedio" name="btn_promedio">
        Calcular promedio
      </button>

      <section id="resultado" class="result-box" aria-live="polite">
        Promedio:
      </section>
    </form>
  </main>

  <script src="dist/solucion1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
