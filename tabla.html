<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla de Multiplicar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-4">Tabla de Multiplicar</h1>

        <form id="form_tabla_multiplicar">
          <div class="mb-3">
            <label for="num_numero" class="form-label">Ingrese un numero</label>
            <input
              type="number"
              class="form-control"
              id="num_numero"
              name="num_numero"
              placeholder="Ejemplo: 5"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary w-100" id="btn_tabla_multiplicar">
            tabla de multiplicar
          </button>
        </form>

        <div class="alert alert-info mt-4 mb-0" role="alert" id="div_resultado">
          Resultado
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dist/tabla.js"></script>
</body>
</html>
